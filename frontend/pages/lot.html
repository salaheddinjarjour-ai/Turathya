<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/images/favicon-192.png">
  <link rel="apple-touch-icon" href="../assets/images/favicon-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="Lot detail">
    <title id="page-title">Lot - TURATHYA</title>

    <script>
        (function () {
            const lang = localStorage.getItem('lang') || 'ar';
            const isAr = lang === 'ar';
            document.documentElement.lang = lang;
            document.documentElement.dir = isAr ? 'rtl' : 'ltr';
            document.documentElement.classList.add('i18n-pending');
            if (isAr) document.documentElement.classList.add('rtl');
        })();
    </script>
  <style>html.i18n-pending body{opacity:0!important;pointer-events:none!important;}</style>
    <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/brand-fonts.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/components/media-gallery.css">
    <link rel="stylesheet" href="../css/pages/lot.css">
    <link rel="stylesheet" href="../css/rtl.css?v=5">
    <link rel="stylesheet" href="../css/components/lang-toggle.css">
</head>

<body>
    <div id="site-header"></div>

    <main class="section">
        <div class="container">
            <div class="lot-layout" id="lot-content">
                <!-- Populated by JavaScript -->
            </div>
        </div>
    </main>

    <!-- Bid Modal -->
    <div class="modal-backdrop" id="bid-modal">
        <div class="modal bid-modal-premium">

            <!-- Header -->
            <div class="modal-header">
                <div class="bid-modal-header-inner">
                    <h3 class="modal-title" data-i18n="bidModal.placeBid">تقديم العرض</h3>
                    <p class="bid-modal-lot-name" id="bid-lot-title"></p>
                </div>
                <button class="modal-close" data-close-modal>
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2.5">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Body -->
            <div class="modal-body">

                <!-- Bid stats row -->
                <div class="bid-stats-row">
                    <div class="bid-stat-block">
                        <span class="bid-stat-label" data-i18n="bidModal.currentBid">العرض الحالي</span>
                        <span class="bid-stat-value" id="bid-current-bid">—</span>
                    </div>
                    <div class="bid-stat-divider"></div>
                    <div class="bid-stat-block">
                        <span class="bid-stat-label" data-i18n="bidModal.minimumBid">الحد الأدنى</span>
                        <span class="bid-stat-value bid-stat-value--accent" id="bid-min-bid">—</span>
                    </div>
                </div>

                <!-- Bid form -->
                <form id="bid-form">
                    <div class="form-group">
                        <label class="form-label" data-i18n="bidModal.yourBid">عرضك</label>
                        <div class="bid-stepper">
                            <button type="button" class="bid-stepper-btn" onclick="decrementBid()" aria-label="Decrease">−</button>
                            <input type="number" class="bid-stepper-input" id="bid-amount" required>
                            <button type="button" class="bid-stepper-btn" onclick="incrementBid()" aria-label="Increase">+</button>
                        </div>
                        <p class="bid-increment-hint">
                            <span data-i18n="bidModal.bidIncrement">زيادة العرض:</span>
                            <strong id="bid-increment-label">$10</strong>
                        </p>
                    </div>
                    <div id="bid-error" class="form-error" style="display:none;"></div>
                </form>
            </div>

            <!-- Footer -->
            <div class="modal-footer">
                <button class="btn btn-secondary" data-close-modal data-i18n="bidModal.cancel">إلغاء</button>
                <button class="btn btn-primary bid-submit-btn"
                    onclick="document.getElementById('bid-form').dispatchEvent(new Event('submit'))"
                    data-i18n="bidModal.placeBid">تقديم العرض</button>
            </div>
        </div>
    </div>


    <!-- Bid Confirmation Modal -->
    <div class="modal-backdrop" id="bid-confirm-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" data-i18n="bidModal.placeBid">Place Bid</h3>
                <button class="modal-close" id="bid-confirm-close">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <p class="text-sm" id="confirm-bid-message"></p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" id="confirm-bid-cancel" data-i18n="bidModal.cancel">Cancel</button>
                <button class="btn btn-primary" id="confirm-bid-submit" data-i18n="bidModal.placeBid">Place Bid</button>
            </div>
        </div>
    </div>

    <!-- Success Modal -->
    <div class="modal-backdrop" id="bid-success-modal">
        <div class="modal">
            <div class="modal-header">
                <h3 class="modal-title" data-i18n="bidModal.bidSuccess">Bid Placed Successfully!</h3>
                <button class="modal-close" data-close-modal>
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>
            <div class="modal-body">
                <p class="text-sm text-muted mb-4" id="success-lot-title"></p>
                <div class="success-summary">
                    <div class="flex justify-between mb-3">
                        <span data-i18n="bidModal.yourBid">Your Bid:</span>
                        <span class="font-semibold" id="success-bid-amount"></span>
                    </div>
                </div>
                <p class="text-sm text-muted mt-6" data-i18n="bidModal.highestBidder">You are currently the highest
                    bidder. You'll be notified if you're
                    outbid.</p>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary w-full" data-close-modal data-i18n="bidModal.close">Close</button>
            </div>
        </div>
    </div>

    <div id="site-footer"></div>
    <script src="../js/i18n.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js?v=2"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/media-gallery.js"></script>
    <script src="../js/countdown.js"></script>
    <script src="../js/watchlist.js"></script>
    <script src="../js/bidding.js"></script>

    <!-- Compute header height for sticky media -->
    <script>
        function setHeaderHeight() {
            const siteHeader = document.getElementById('site-header');
            if (siteHeader) {
                const h = siteHeader.offsetHeight || 0;
                document.documentElement.style.setProperty('--header-h', h + 'px');
            }
        }
        window.addEventListener('load', setHeaderHeight);
        window.addEventListener('resize', setHeaderHeight);
        setTimeout(setHeaderHeight, 100);
    </script>
    <script>
        const lotId = getUrlParameter('id');

        function refreshLotData() {
            loadLot();
        }

        /* ─── Nuclear cleanup: remove all auction DOM elements ─────── */
        function removeAuctionElements() {
            // Remove bid modals from DOM entirely
            document.getElementById('bid-modal')?.remove();
            document.getElementById('bid-confirm-modal')?.remove();
            document.getElementById('bid-success-modal')?.remove();
            // Remove any auction sections that may have leaked in
            document.querySelector('.bid-section')?.remove();
            document.querySelector('.auction-sidebar')?.remove();
            document.querySelector('.auction-estimate')?.remove();
            document.querySelector('.countdown')?.remove();
            document.querySelector('.bid-button')?.remove();
            document.querySelector('.current-bid')?.remove();
            document.querySelector('.countdown-section')?.remove();
        }

        /* ─── Render: COLLECTION (gallery/museum mode) ─────────────── */
        function renderCollectionDetail(lot) {
            // Switch container class to collection layout
            const wrapper = document.getElementById('lot-content');
            wrapper.className = 'collection-mode-layout';

            // Add class to body for CSS targeting
            document.body.classList.add('collection-mode');
            document.body.classList.remove('auction-mode');

            // Destroy all auction DOM elements — nuclear option
            removeAuctionElements();

            const lTitle     = localizedField(lot, 'title');
            const lDesc      = localizedField(lot, 'description');
            const lCat       = localizedField(lot, 'category');
            const lCondition = localizedField(lot, 'condition');
            const lProvenance= localizedField(lot, 'provenance');
            const catGrp     = localizedField(lot, 'auction_title') || lot.auction_title || '';
            const lang       = localStorage.getItem('lang') || 'ar';
            const isAr       = lang === 'ar';

            const T = (k, fallback) => {
                if (window.i18n && window.i18n.t) { const v = window.i18n.t(k); if (v && v !== k) return v; }
                return fallback || k;
            };

            const LABELS = {
                description : { ar: 'الوصف',          en: 'Description'         },
                condition   : { ar: 'الحالة',          en: 'Condition'           },
                provenance  : { ar: 'المصدر والأصل',   en: 'Provenance & Origin'  },
                shipping    : { ar: 'الشحن والاستلام', en: 'Shipping & Pickup'   },
                lotNumber   : { ar: 'قطعة',            en: 'Lot'                 },
            };
            const L = (k) => isAr ? LABELS[k].ar : LABELS[k].en;

            const metaItems = [];
            if (lCondition) metaItems.push({ label: L('condition'), value: lCondition });
            if (lProvenance) metaItems.push({ label: L('provenance'), value: lProvenance });

            const metaGridHTML = metaItems.length > 0
                ? `<div class="collection-detail__meta-grid">${metaItems.map(m =>
                    `<div class="collection-detail__meta-item">
                        <span class="meta-label">${m.label}</span>
                        <span class="meta-value">${m.value}</span>
                     </div>`).join('')}</div>`
                : '';

            const shippingText = lot.shipping ||
                T('auction.contactForShipping', isAr ? 'تواصل معنا للاستفسار عن الشحن' : 'Contact us for shipping details');
            const descText = lDesc ||
                T('auction.noDescription', isAr ? 'لا يوجد وصف' : 'No description available');

            wrapper.innerHTML =
                '<div class="collection-detail">' +
                    '<div class="collection-detail__gallery" id="lot-media-gallery"></div>' +
                    '<div class="collection-detail__body">' +
                        `<div class="collection-detail__category">${lCat || L('lotNumber') + ' ' + lot.lot_number}</div>` +
                        `<h1 class="collection-detail__title">${lTitle}</h1>` +
                        (catGrp ? `<p class="collection-detail__subtitle">${catGrp}</p>` : '') +
                        '<hr class="collection-detail__divider">' +
                        metaGridHTML +
                        `<div class="collection-detail__section"><h3>${L('description')}</h3><p>${descText}</p></div>` +
                        `<div class="collection-detail__section"><h3>${L('shipping')}</h3><p>${shippingText}</p></div>` +
                    '</div>' +
                '</div>';

            const mediaItems = prepareMediaItems(lot);
            if (mediaItems.length > 0) {
                initMediaGallery('lot-media-gallery', mediaItems);
            }
        }

        /* ─── Render: AUCTION (full bidding mode) ──────────────────── */
        function renderAuctionDetail(lot) {
            const wrapper = document.getElementById('lot-content');
            wrapper.className = 'lot-layout';
            document.body.classList.add('auction-mode');
            document.body.classList.remove('collection-mode');

            const isClosed = hasEnded(lot.end_date) || lot.status !== 'active';
            const currentUser = getCurrentUser();
            const isUserWinning = currentUser && lot.highest_bidder_id === currentUser.id;

            const lTitle      = localizedField(lot, 'title');
            const lDesc       = localizedField(lot, 'description');
            const lCat        = localizedField(lot, 'category');
            const lCondition  = localizedField(lot, 'condition');
            const lProvenance = localizedField(lot, 'provenance');
            const auctionTitle= localizedField(lot, 'auction_title') || lot.auction_title;

            // Countdown dates: prefer lot's own, fall back to auction dates
            const countdownStart = lot.start_date || lot.auction_start_date;
            const countdownEnd   = lot.end_date   || lot.auction_end_date;

            let bidButtonHtml;
            if (isClosed) {
                bidButtonHtml = `<button class="btn btn-secondary btn-lg w-full mb-6" disabled>${i18n.t('auction.biddingClosed')}</button>`;
            } else if (isUserWinning) {
                bidButtonHtml = `<button class="btn btn-success btn-lg w-full mb-6" disabled style="cursor:default;opacity:0.9;">` +
                    `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:inline-block;vertical-align:middle;margin-right:.5rem;"><polyline points="20 6 9 17 4 12"></polyline></svg>` +
                    `${i18n.t('bidModal.alreadyWinning')}</button>`;
            } else {
                bidButtonHtml = `<button class="btn btn-accent btn-lg w-full mb-6" onclick="showBidModal('${lot.id}')">${i18n.t('auction.placeBid')}</button>`;
            }

            let timerHTML;
            const now = new Date();
            const startD = countdownStart ? parseDateSafe(countdownStart) : null;
            const endD   = countdownEnd   ? parseDateSafe(countdownEnd)   : null;
            const hasStarted = !startD || startD <= now;
            if (!hasStarted) {
                timerHTML = `<span class="label">${i18n.t('auction.startsIn')}</span><div data-countdown="${countdownStart}"></div>`;
            } else if (endD && endD > now) {
                timerHTML = `<span class="label">${i18n.t('auction.timeRemaining')}</span><div data-countdown="${countdownEnd}"></div>`;
            } else {
                timerHTML = `<span class="text-muted">${i18n.t('time.ended')}</span>`;
            }

            wrapper.innerHTML =
                '<div id="lot-media-gallery"></div>' +
                '<div class="lot-details">' +
                    '<div class="lot-header">' +
                        '<div class="flex justify-between items-start mb-4">' +
                            '<div>' +
                                `<div class="label mb-2">Lot ${lot.lot_number} • ${lCat || i18n.t('categories.other')}</div>` +
                                `<h1 class="lot-title">${lTitle}</h1>` +
                            '</div>' +
                            `<button class="watchlist-btn" data-watchlist-lot="${lot.id}" title="${i18n.t('auction.addToWatchlist')}">` +
                                `<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon></svg>` +
                            '</button>' +
                        '</div>' +
                        `<p class="text-sm text-muted mb-6"><a href="auction.html?id=${lot.auction_id}" class="text-accent">${auctionTitle || i18n.t('nav.auctions')}</a></p>` +
                    '</div>' +
                    '<div class="bid-section">' +
                        '<div class="current-bid">' +
                            `<span class="label">${i18n.t('auction.currentBid')}</span>` +
                            `<span class="price">${lot.current_bid && lot.current_bid > 0 ? formatCurrency(lot.current_bid) : formatCurrency(lot.starting_bid)}</span>` +
                            (lot.bid_count > 0
                                ? `<span class="text-sm text-muted">${lot.bid_count} ${lot.bid_count !== 1 ? i18n.t('auction.bids') : i18n.t('auction.bid')}</span>`
                                : `<span class="text-sm text-muted">${i18n.t('auction.noBids')}</span>`) +
                        '</div>' +
                        `<div class="countdown-section">${timerHTML}</div>` +
                    '</div>' +
                    bidButtonHtml +
                    `<div class="info-section"><h3>${i18n.t('auction.estimate')}</h3><p class="estimate">${formatEstimate(lot.estimate_low, lot.estimate_high)}</p></div>` +
                    `<div class="info-section"><h3>${i18n.t('auction.description')}</h3><p>${lDesc || i18n.t('auction.noDescription')}</p></div>` +
                    `<div class="info-section"><h3>${i18n.t('auction.condition')}</h3><p>${lCondition || i18n.t('auction.notSpecified')}</p></div>` +
                    (lProvenance ? `<div class="info-section"><h3>${i18n.t('auction.provenance')}</h3><p>${lProvenance}</p></div>` : '') +
                    `<div class="info-section"><h3>${i18n.t('auction.shippingPickup')}</h3><p>${lot.shipping || i18n.t('auction.contactForShipping')}</p></div>` +
                '</div>';

            initCountdowns();
            updateWatchlistButtons();

            const mediaItems = prepareMediaItems(lot);
            if (mediaItems.length > 0) {
                initMediaGallery('lot-media-gallery', mediaItems);
            }
        }

        /* ─── Main load function ───────────────────────────────────── */
        async function loadLot() {
            try {
                const { lot } = await lotsAPI.getById(lotId);

                if (!lot) {
                    window.location.href = 'auctions.html';
                    return;
                }


                document.getElementById('page-title').textContent =
                    (localizedField(lot, 'title') || lot.title) + ' - TURATHYA';

                // If opened from the Collection page, always render collection layout
                // regardless of whether the lot has auction fields populated.
                const isCollectionView = new URLSearchParams(window.location.search).get('view') === 'collection';
                const isAuctionItem = !isCollectionView && hasAuction(lot);

                if (isAuctionItem) {
                    renderAuctionDetail(lot);
                } else {
                    renderCollectionDetail(lot);
                }

            } catch (error) {
                console.error('[TURATHYA] Failed to load lot:', error);
                alert('Failed to load lot details');
                window.location.href = 'auctions.html';
            }
        }

        function prepareMediaItems(lot) {
            const items = [];
            const fallbackCover = lot.image_data || lot.auction_image || '../assets/images/placeholder.jpg';

            if (lot.media && lot.media.length > 0) {
                lot.media.forEach((media, index) => {
                    const mediaItem = {
                        type: media.media_type || 'image',
                        src: media.url,
                        alt: lot.title + ' - ' + (index + 1)
                    };
                    if (media.media_type === 'video' && media.thumbnail_url) {
                        mediaItem.poster = media.thumbnail_url;
                    }
                    if (media.media_type === 'video') {
                        mediaItem.fallbackPoster = fallbackCover;
                    }
                    items.push(mediaItem);
                });
            } else {
                const lotImage = lot.image_data || lot.auction_image;
                if (lotImage) {
                    items.push({ type: 'image', src: lotImage, alt: lot.title });
                }
            }

            if (items.length === 0) {
                items.push({ type: 'image', src: '../assets/images/placeholder.jpg', alt: lot.title });
            }

            return items;
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!lotId) {
                window.location.href = 'auctions.html';
                return;
            }
            // Wait for i18n to finish loading translations before rendering lot content,
            // otherwise i18n.t() calls inside renderAuctionDetail return raw keys.
            if (window.i18n && window.i18n.isInitialized) {
                loadLot();
            } else {
                window.addEventListener('i18nReady', () => loadLot(), { once: true });
            }
        });

        // Reload lot content when language changes
        window.addEventListener('languageChanged', () => {
            loadLot();
        });
    </script>

</body>

</html>
