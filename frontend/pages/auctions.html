<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/images/favicon-192.png">
  <link rel="apple-touch-icon" href="../assets/images/favicon-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description"
        content="Browse live auction products at TURATHYA and place bids on active lots.">
    <title>Live Auctions - TURATHYA</title>

    <script>
        (function () {
            const lang = localStorage.getItem('lang') || 'ar';
            const isAr = lang === 'ar';
            document.documentElement.lang = lang;
            document.documentElement.dir = isAr ? 'rtl' : 'ltr';
            document.documentElement.classList.add('i18n-pending');
            if (isAr) document.documentElement.classList.add('rtl');
        })();
    </script>
  <style>html.i18n-pending body{opacity:0!important;pointer-events:none!important;}</style>
    <style>
        html.i18n-pending body {
            opacity: 0;
            pointer-events: none;
        }

        /* ── Full-bleed hero — matches Contact / About Us ── */
        .auc-hero {
            position: relative;
            min-height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 120px 24px 96px;
        }

        .auc-hero__bg {
            position: absolute; inset: 0;
            background-image: url('../assets/images/fill-bg-3.png');
            background-size: cover;
            background-position: center;
            z-index: 0;
        }

        .auc-hero__overlay {
            position: absolute; inset: 0;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(0,0,0,.18) 0%, transparent 55%),
                linear-gradient(175deg, rgba(10,8,4,.62) 0%, rgba(5,4,2,.80) 100%);
            z-index: 1;
        }

        .auc-hero__content {
            position: relative; z-index: 2;
            max-width: 680px;
            text-align: center !important;
            width: 100%;
        }

        .auc-hero__title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.6rem, 5.5vw, 4.2rem);
            font-weight: 400;
            color: #fff;
            line-height: 1.10;
            margin-bottom: 16px;
            text-align: center !important;
        }

        .auc-hero__sub {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            color: rgba(255,255,255,.72);
            line-height: 1.70;
            text-align: center !important;
        }

        .auc-hero__line {
            width: 52px; height: 1px;
            background: linear-gradient(90deg, transparent, #c9a96e, transparent);
            margin: 18px auto 0;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/brand-fonts.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/auctions.css">
    <link rel="stylesheet" href="../css/components/lot-card.css">
    <link rel="stylesheet" href="../css/rtl.css?v=5">
    <link rel="stylesheet" href="../css/components/lang-toggle.css">
</head>

<body>
    <div id="site-header"></div>

    <!-- Full-bleed hero — same shape as Contact / About Us -->
    <section class="auc-hero">
        <div class="auc-hero__bg"></div>
        <div class="auc-hero__overlay"></div>
        <div class="auc-hero__content">
            <h1 class="auc-hero__title" data-i18n="auctionsPage.heroTitle">Live Auctions</h1>
            <p class="auc-hero__sub" data-i18n="auctionsPage.heroSub">Products currently being auctioned in real time</p>
            <div class="auc-hero__line"></div>
        </div>
    </section>

    <main class="section">
        <div class="container">

            <!-- Featured Products Section -->
            <section class="section-spacing" id="featured-section">
                <div class="lot-section-header">
                    <div class="lot-section-label">TURATHYA</div>
                    <h2 class="lot-section-title" data-i18n="auctionsPage.featuredTitle">Featured Products</h2>
                    <p class="lot-section-sub" data-i18n="auctionsPage.featuredSub">Top bidding activity right now</p>
                    <div class="lot-section-divider"></div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-lg" id="featured-auctions">
                    <!-- Populated by JavaScript -->
                </div>
            </section>

            <!-- Live Products Section -->
            <section class="section-spacing" id="ongoing-section">
                <div class="lot-section-header">
                    <div class="lot-section-label">TURATHYA</div>
                    <h2 class="lot-section-title" data-i18n="auctionsPage.liveTitle">Live Products</h2>
                    <p class="lot-section-sub" data-i18n="auctionsPage.liveSub">Only products currently in auction windows</p>
                    <div class="lot-section-divider"></div>
                </div>

                <!-- Search & Filter Toolbar -->
                <div class="auctions-toolbar">
                    <div style="flex: 1; max-width: 420px;">
                        <label class="form-label" for="auction-search" data-i18n="auctionsPage.searchLabel">Search products</label>
                        <input type="search" class="form-input search-input" id="auction-search"
                            data-i18n-placeholder="auctionsPage.searchPlaceholder"
                            placeholder="Search by title, lot number, category">
                    </div>
                    <select id="category-filter">
                        <option value="" data-i18n="categories.all">جميع الفئات</option>
                        <!-- Populated by JavaScript -->
                    </select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-lg" id="ongoing-auctions">
                    <!-- Populated by JavaScript -->
                </div>
            </section>

            <!-- Recently Ended Products Section -->
            <section class="section-spacing" id="past-section">
                <div class="lot-section-header">
                    <div class="lot-section-label">TURATHYA</div>
                    <h2 class="lot-section-title" data-i18n="auctionsPage.endedTitle">Recently Ended Products</h2>
                    <p class="lot-section-sub" data-i18n="auctionsPage.endedSub">Products that recently finished auction</p>
                    <div class="lot-section-divider"></div>
                </div>
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-lg" id="past-auctions">
                    <!-- Populated by JavaScript -->
                </div>
            </section>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="../js/utils.js?v=2"></script>
    <script src="../js/api.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/countdown.js"></script>
    <script src="../js/lot-cards.js"></script>
    <script src="../js/i18n.js"></script>
    <script>
        // i18n helper — safe to call before or after i18n fully loads
        const T = (k) => (window.i18n && window.i18n.t) ? window.i18n.t(k) : k;

        let selectedCategory = null;
        let searchQuery = '';
        let allLots = [];

        function isLiveLot(lot) {
            // Must be an auction item — collection-only items never appear here
            if (typeof hasAuction === 'function' && !hasAuction(lot)) return false;
            const now = new Date();
            const startDate = lot.start_date ? new Date(lot.start_date) : null;
            const endDate = lot.end_date ? new Date(lot.end_date) : null;
            if (!endDate || Number.isNaN(endDate.getTime())) return false;
            if (startDate && !Number.isNaN(startDate.getTime()) && startDate > now) return false;
            return endDate > now && lot.status === 'active';
        }

        function isEndedLot(lot) {
            // Must be an auction item — collection-only items never appear here
            if (typeof hasAuction === 'function' && !hasAuction(lot)) return false;
            const endDate = lot.end_date ? new Date(lot.end_date) : null;
            return !!endDate && !Number.isNaN(endDate.getTime()) && endDate < new Date();
        }

        // ── Card renderer → delegates to shared lot-cards.js ──
        function renderAuctionCard(lot, isPast) {
            return buildAuctionCard(lot, isPast || false);
        }


        // ── Live countdown engine ──────────────────────────────────
        function updateLotTimer(el) {
            const end = el.dataset.lotEnd;
            if (!end) return;
            const parsedEnd = (typeof parseDateSafe === 'function') ? parseDateSafe(end) : new Date(end);
            if (!parsedEnd || Number.isNaN(parsedEnd.getTime())) {
                el.textContent = '—';
                el.classList.remove('ending-soon-timer');
                return;
            }
            const diff = parsedEnd - new Date();
            if (diff <= 0) {
                el.textContent = T('time.ended');
                el.classList.remove('ending-soon-timer');
                return;
            }
            const s  = Math.floor(diff / 1000);
            const d  = Math.floor(s / 86400);
            const h  = Math.floor((s % 86400) / 3600);
            const m  = Math.floor((s % 3600) / 60);
            const sc = s % 60;
            let text;
            if (d > 0)      { text = `${d}d ${h}h`; }
            else if (h > 0) { text = `${h}h ${m}m`; }
            else            { text = `${m}m ${String(sc).padStart(2,'0')}s`; el.classList.add('ending-soon-timer'); }
            el.textContent = text;
        }

        function startLotCountdowns() {
            document.querySelectorAll('[data-lot-end]').forEach(updateLotTimer);
            clearInterval(window._lotCountdownInterval);
            window._lotCountdownInterval = setInterval(() => {
                document.querySelectorAll('[data-lot-end]').forEach(updateLotTimer);
            }, 1000);
        }

        async function loadAllLots() {
            const { lots } = await lotsAPI.getAll({});
            allLots = lots || [];
            return allLots;
        }

        function getFilteredLiveLots() {
            let lots = allLots.filter((lot) => isLiveLot(lot));

            if (selectedCategory) {
                lots = lots.filter((lot) => (lot.category || '').toLowerCase() === selectedCategory.toLowerCase());
            }

            if (searchQuery) {
                const q = searchQuery.toLowerCase();
                lots = lots.filter((lot) =>
                    (lot.title || '').toLowerCase().includes(q) ||
                    (lot.description || '').toLowerCase().includes(q) ||
                    (lot.category || '').toLowerCase().includes(q) ||
                    String(lot.lot_number || '').includes(q) ||
                    (lot.category_title || lot.auction_title || '').toLowerCase().includes(q)
                );
            }

            return lots;
        }

        async function loadFeaturedAuctions() {
            try {
                await loadAllLots();
                const recentLotIds = JSON.parse(localStorage.getItem('recentLots') || '[]');
                // Only auction items in featured — collection-only items excluded
                const liveLots = allLots.filter((lot) => isLiveLot(lot));

                const ranked = [...liveLots].sort((a, b) => {
                    const aBid = Number(a.current_bid || 0);
                    const bBid = Number(b.current_bid || 0);
                    const aCount = Number(a.bid_count || 0);
                    const bCount = Number(b.bid_count || 0);
                    if (bCount !== aCount) return bCount - aCount;
                    return bBid - aBid;
                });

                const recentFirst = recentLotIds
                    .map((id) => liveLots.find((lot) => lot.id === id))
                    .filter(Boolean);

                const combined = [...recentFirst];
                ranked.forEach((lot) => {
                    if (!combined.find((item) => item.id === lot.id)) {
                        combined.push(lot);
                    }
                });

                const featuredLots = combined.slice(0, 6);
                const container = document.getElementById('featured-auctions');
                const section = document.getElementById('featured-section');

                if (featuredLots.length === 0) {
                    section.style.display = 'none';
                    return;
                }

                container.innerHTML = featuredLots.map((lot) => renderAuctionCard(lot, false)).join('');
                initCardSliders(container);
                startLotCountdowns();
            } catch (error) {
                console.error('Failed to load featured products:', error);
                document.getElementById('featured-section').style.display = 'none';
            }
        }

        async function loadOngoingAuctions() {
            try {
                if (allLots.length === 0) {
                    await loadAllLots();
                }

                const liveLots = getFilteredLiveLots();
                const container = document.getElementById('ongoing-auctions');

                if (liveLots.length === 0) {
                    container.innerHTML = `<p class="text-center text-muted" style="grid-column: 1 / -1;">${T('auctionsPage.noLiveProducts')}</p>`;
                    return;
                }

                container.innerHTML = liveLots
                    .sort((a, b) => new Date(a.end_date) - new Date(b.end_date))
                    .map((lot) => renderAuctionCard(lot, false))
                    .join('');
                initCardSliders(container);
                startLotCountdowns();
            } catch (error) {
                console.error('Failed to load live products:', error);
                document.getElementById('ongoing-auctions').innerHTML =
                    `<p class="text-center text-muted" style="grid-column: 1 / -1;">${T('auctionsPage.failedLoad')}</p>`;
            }
        }

        async function loadPastAuctions() {
            try {
                if (allLots.length === 0) {
                    await loadAllLots();
                }

                const endedLots = allLots
                    .filter((lot) => isEndedLot(lot))
                    .sort((a, b) => new Date(b.end_date) - new Date(a.end_date))
                    .slice(0, 12);

                const container = document.getElementById('past-auctions');
                const section = document.getElementById('past-section');

                if (endedLots.length === 0) {
                    section.style.display = 'none';
                    return;
                }

                container.innerHTML = endedLots.map((lot) => renderAuctionCard(lot, true)).join('');
                initCardSliders(container);
                startLotCountdowns();
            } catch (error) {
                console.error('Failed to load ended products:', error);
                document.getElementById('past-section').style.display = 'none';
            }
        }

        async function loadCategoryFilter() {
            try {
                if (allLots.length === 0) {
                    await loadAllLots();
                }

                // Only pull categories from auction items
                const auctionLots = (typeof hasAuction === 'function') ? allLots.filter(hasAuction) : allLots;
                const categories = [...new Set(auctionLots.map((lot) => lot.category).filter(Boolean))].sort();
                const select = document.getElementById('category-filter');

                categories.forEach((cat) => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    select.appendChild(option);
                });

                select.addEventListener('change', (e) => {
                    selectedCategory = e.target.value || null;
                    loadOngoingAuctions();
                });
            } catch (error) {
                console.error('Failed to load product categories:', error);
            }
        }

        // Initialize search input
        function initSearch() {
            const input = document.getElementById('auction-search');
            if (!input) return;

            // Pre-fill from URL if present
            const existing = getUrlParameter('search');
            if (existing) {
                searchQuery = existing;
                input.value = existing;
            }

            const handleSearchInput = debounce((event) => {
                searchQuery = event.target.value.trim();

                if (searchQuery) {
                    setUrlParameter('search', searchQuery);
                } else {
                    removeUrlParameter('search');
                }

                loadOngoingAuctions();
            }, 200);

            input.addEventListener('input', handleSearchInput);
        }

        // Initialize page
        document.addEventListener('DOMContentLoaded', () => {
            loadFeaturedAuctions();
            loadCategoryFilter();
            initSearch();

            // If search param present on load, honor it
            const initialSearch = getUrlParameter('search');
            if (initialSearch) {
                searchQuery = initialSearch;
            }

            loadOngoingAuctions();
            loadPastAuctions();
        });
    </script>
</body>

</html>
