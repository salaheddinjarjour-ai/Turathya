<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/images/favicon-192.png">
  <link rel="apple-touch-icon" href="../assets/images/favicon-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="View all products in this category">
    <title id="page-title">Category - TURATHYA</title>

    <script>
        (function () {
            const lang = localStorage.getItem('lang') || 'ar';
            const isAr = lang === 'ar';
            document.documentElement.lang = lang;
            document.documentElement.dir = isAr ? 'rtl' : 'ltr';
            document.documentElement.classList.add('i18n-pending');
            if (isAr) document.documentElement.classList.add('rtl');
        })();
    </script>
  <style>html.i18n-pending body{opacity:0!important;pointer-events:none!important;}</style>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/brand-fonts.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/auction.css">
    <link rel="stylesheet" href="../css/rtl.css?v=5">
    <link rel="stylesheet" href="../css/components/lang-toggle.css">

    <style>
        html.i18n-pending body {
            opacity: 0;
            pointer-events: none;
        }

        /* ══════════════════════════════════════════
           PREMIUM AUCTION HERO
        ══════════════════════════════════════════ */
        .auction-hero {
            position: relative;
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 140px 24px 80px;
        }

        /* Background image layer — set via JS */
        .ah-bg {
            position: absolute;
            inset: 0;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            /* Subtle scale for cinematic feel */
            transform: scale(1.04);
            transition: transform 12s ease-out;
            z-index: 0;
        }
        .ah-bg.loaded { transform: scale(1); }

        /* Dark gradient overlay */
        .ah-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(15, 10, 5, 0.72) 0%,
                rgba(15, 10, 5, 0.82) 60%,
                rgba(15, 10, 5, 0.92) 100%
            );
            z-index: 1;
        }

        /* Content container */
        .ah-content {
            position: relative;
            z-index: 2;
            max-width: 760px;
            width: 100%;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0;

            /* Staggered fade-in */
            animation: ahFadeUp 0.9s cubic-bezier(.22,.68,0,1.2) both;
        }

        @keyframes ahFadeUp {
            from { opacity: 0; transform: translateY(28px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* Small gold category label */
        .ah-label {
            display: inline-block;
            font-family: 'Inter', sans-serif;
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: #C6A46C;
            margin-bottom: 22px;
            opacity: 0;
            animation: ahFadeUp 0.7s 0.1s cubic-bezier(.22,.68,0,1.2) forwards;
        }

        /* Main auction title */
        .ah-title {
            font-family: 'Playfair Display', 'Cormorant Garamond', serif;
            font-size: clamp(2rem, 5vw, 3.6rem);
            font-weight: 400;
            color: #f5ede0;
            line-height: 1.18;
            margin: 0 0 22px 0;
            text-align: center !important;
            opacity: 0;
            animation: ahFadeUp 0.75s 0.2s cubic-bezier(.22,.68,0,1.2) forwards;
        }

        /* Gold divider */
        .ah-divider {
            width: 100px;
            height: 1px;
            background: linear-gradient(90deg, transparent, #C6A46C, transparent);
            margin: 0 auto 28px;
            opacity: 0;
            animation: ahFadeUp 0.7s 0.3s cubic-bezier(.22,.68,0,1.2) forwards;
        }

        /* Short description */
        .ah-desc {
            font-family: 'Inter', 'Helvetica Neue', sans-serif;
            font-size: 0.97rem;
            font-weight: 300;
            color: rgba(245, 237, 224, 0.75);
            line-height: 1.72;
            max-width: 600px;
            text-align: center !important;
            margin: 0 0 36px 0;
            opacity: 0;
            animation: ahFadeUp 0.7s 0.38s cubic-bezier(.22,.68,0,1.2) forwards;
        }

        /* Info cards row */
        .ah-cards {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
            width: 100%;
            opacity: 0;
            animation: ahFadeUp 0.7s 0.48s cubic-bezier(.22,.68,0,1.2) forwards;
        }

        .ah-card {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(198, 164, 108, 0.25);
            padding: 14px 22px;
            border-radius: 10px;
            backdrop-filter: blur(8px);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            min-width: 140px;
            transition: border-color 0.25s, background 0.25s;
        }
        .ah-card:hover {
            border-color: rgba(198, 164, 108, 0.5);
            background: rgba(255, 255, 255, 0.07);
        }

        .ah-card-label {
            font-family: 'Inter', sans-serif;
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: #C6A46C;
            white-space: nowrap;
        }

        .ah-card-value {
            font-family: 'Inter', sans-serif;
            font-size: 0.88rem;
            font-weight: 400;
            color: rgba(245, 237, 224, 0.88);
            white-space: nowrap;
        }

        /* RTL — keep centered */
        html[dir="rtl"] .ah-content,
        html[dir="rtl"] .ah-title,
        html[dir="rtl"] .ah-desc {
            text-align: center !important;
        }

        /* Mobile */
        @media (max-width: 600px) {
            .ah-cards { gap: 10px; }
            .ah-card  { min-width: 120px; padding: 12px 14px; }
            .ah-card-value { font-size: 0.78rem; }
        }
    </style>
</head>

<body>
    <div id="site-header"></div>

    <!-- ── Premium Auction Hero ── -->
    <section class="auction-hero" id="auction-hero">
        <!-- BG image: set from JS once auction data is loaded -->
        <div class="ah-bg" id="ah-bg"></div>
        <div class="ah-overlay"></div>

        <div class="ah-content" id="auction-header">
            <!-- Populated by JavaScript -->
        </div>
    </section>

    <main class="section">
        <div class="container">

            <!-- Sort Controls -->
            <div class="auction-toolbar">
                <span class="text-sm text-muted" id="lot-count">Loading...</span>
                <select class="form-select" id="sort-select" style="width: auto;">
                    <option value="lotNumber">Lot Number</option>
                    <option value="endingSoon">Ending Soon</option>
                    <option value="currentBid">Current Bid</option>
                </select>
            </div>

            <!-- Lots Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-lg" id="lots-grid">
                <!-- Populated by JavaScript -->
            </div>
        </div>
    </main>

    <div id="site-footer"></div>

    <script src="../js/i18n.js"></script>
    <script src="../js/api.js?v=3"></script>
    <script src="../js/utils.js?v=3"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/countdown.js"></script>
    <script src="../js/watchlist.js"></script>

    <!-- Compute header height for hero sizing -->
    <script>
        function setHeaderHeight() {
            const siteHeader = document.getElementById('site-header');
            if (siteHeader) {
                const h = siteHeader.offsetHeight || 0;
                document.documentElement.style.setProperty('--header-h', h + 'px');
            }
        }
        window.addEventListener('load', setHeaderHeight);
        window.addEventListener('resize', setHeaderHeight);
        setTimeout(setHeaderHeight, 100);
    </script>

    <script>
        const categoryId = getUrlParameter('id');
        let currentSort = 'lotNumber';

        // Track auction view for featured section
        function trackAuctionView(categoryId) {
            const recentAuctions = JSON.parse(localStorage.getItem('recentAuctions') || '[]');
            const filtered = recentAuctions.filter(id => id !== categoryId);
            filtered.unshift(categoryId);
            localStorage.setItem('recentAuctions', JSON.stringify(filtered.slice(0, 5)));
        }

        async function loadAuction() {
            try {
                const { category: auction } = await categoriesAPI.getById(categoryId);

                if (!auction) {
                    window.location.href = '/auctions';
                    return;
                }

                trackAuctionView(categoryId);

                const aTitle = localizedField(auction, 'title');
                const aDesc  = localizedField(auction, 'description');
                const aCat   = localizedField(auction, 'category');

                document.getElementById('page-title').textContent = aTitle + ' - TURATHYA';

                /* ── Set hero background image ── */
                const bg = document.getElementById('ah-bg');
                if (auction.image_url || auction.image_data) {
                    bg.style.backgroundImage = `url('${auction.image_url || auction.image_data}')`;
                    // Fallback to fill-bg-3 if auction has no image
                } else {
                    bg.style.backgroundImage = "url('../assets/images/fill-bg-3.png')";
                }
                // Trigger scale animation
                requestAnimationFrame(() => setTimeout(() => bg.classList.add('loaded'), 50));

                /* ── Label text ── */
                const labelText = (aCat || 'Curated Category').toUpperCase();

                /* ── Format dates ── */
                const startFmt = auction.start_date ? formatDateTime(auction.start_date) : '—';
                const endFmt   = auction.end_date   ? formatDateTime(auction.end_date)   : '—';
                const lotCount = auction.lot_count || 0;

                /* ── i18n keys ── */
                const lang = localStorage.getItem('lang') || 'ar';
                const isAr = lang === 'ar';

                const startsLbl = isAr ? 'بداية الفئة' : 'Category Starts';
                const endsLbl   = isAr ? 'نهاية الفئة' : 'Category Ends';
                const lotsLbl   = isAr ? 'إجمالي المنتجات' : 'Total Products';

                /* ── Inject premium hero markup ── */
                const header = document.getElementById('auction-header');
                header.innerHTML = `
                    <span class="ah-label">${labelText}</span>

                    <h1 class="ah-title">${aTitle}</h1>

                    <div class="ah-divider"></div>

                    ${aDesc ? `<p class="ah-desc">${aDesc}</p>` : ''}

                    <div class="ah-cards">
                        <div class="ah-card">
                            <span class="ah-card-label" data-i18n="auction.starts">${startsLbl}</span>
                            <span class="ah-card-value">${startFmt}</span>
                        </div>
                        <div class="ah-card">
                            <span class="ah-card-label" data-i18n="auction.ends">${endsLbl}</span>
                            <span class="ah-card-value">${endFmt}</span>
                        </div>
                        <div class="ah-card">
                            <span class="ah-card-label" data-i18n="auction.totalLots">${lotsLbl}</span>
                            <span class="ah-card-value">${lotCount}</span>
                        </div>
                    </div>
                `;

                // Re-translate any i18n keys injected into the DOM
                if (window.i18n) window.i18n.translatePage();

                await loadLots();
            } catch (error) {
                console.error('Failed to load auction:', error);
                window.location.href = '/auctions';
            }
        }

        async function loadLots() {
            try {
                const { products: lots } = await categoriesAPI.getProducts(categoryId);

                if (currentSort === 'lotNumber') {
                    lots.sort((a, b) => a.lot_number - b.lot_number);
                } else if (currentSort === 'endingSoon') {
                    lots.sort((a, b) => new Date(a.end_date) - new Date(b.end_date));
                } else if (currentSort === 'currentBid') {
                    lots.sort((a, b) => (b.current_bid || 0) - (a.current_bid || 0));
                }

                document.getElementById('lot-count').textContent =
                    lots.length + ' product' + (lots.length !== 1 ? 's' : '');

                const container = document.getElementById('lots-grid');

                if (lots.length === 0) {
                    container.innerHTML = '<p class="text-center text-muted" style="grid-column: 1 / -1;">No products in this category yet</p>';
                    return;
                }

                container.innerHTML = lots.map(lot => {
                    const imageUrl   = lot.primary_image || lot.image_data || '../assets/images/placeholder.jpg';
                    const currentBid = lot.current_bid && lot.current_bid > 0;
                    const lTitle     = localizedField(lot, 'title');

                    return '<a href="lot.html?id=' + lot.id + '" class="card">' +
                        '<img loading="lazy" src="' + imageUrl + '" alt="' + lTitle + '" class="card-image">' +
                        '<div class="card-content">' +
                        '<div class="label mb-2">Product ' + lot.lot_number + '</div>' +
                        '<h4 class="card-title" style="font-size: var(--text-lg);">' + lTitle + '</h4>' +
                        '<p class="price mt-4">' + (currentBid ? formatCurrency(lot.current_bid) : formatCurrency(lot.starting_bid)) + '</p>' +
                        '<p class="estimate">' + (currentBid ? 'Current Bid' : 'Starting Bid') + '</p>' +
                        '</div>' +
                        '<div class="card-footer">' +
                        '<span class="text-xs" data-countdown="' + lot.end_date + '" data-compact></span>' +
                        (isEndingSoon(lot.end_date) ? '<span class="badge badge-accent">Ending Soon</span>' : '') +
                        '</div>' +
                        '</a>';
                }).join('');

                initCountdowns();
            } catch (error) {
                console.error('Failed to load lots:', error);
                document.getElementById('lots-grid').innerHTML =
                    '<p class="text-center text-muted" style="grid-column: 1 / -1;">Failed to load lots</p>';
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            if (!categoryId) {
                window.location.href = '/auctions';
                return;
            }

            loadAuction();

            document.getElementById('sort-select').addEventListener('change', (e) => {
                currentSort = e.target.value;
                loadLots();
            });
        });
    </script>
</body>

</html>
