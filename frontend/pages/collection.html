<!DOCTYPE html>
<html lang="en">

<head>
  <link rel="icon" type="image/png" sizes="32x32" href="../assets/images/favicon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="../assets/images/favicon-192.png">
  <link rel="apple-touch-icon" href="../assets/images/favicon-192.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="description" content="TURATHYA Collection - A curated archive of rare and exceptional auction lots.">
    <title>Collection - TURATHYA</title>

    <script>
        (function () {
            const lang = localStorage.getItem('lang') || 'ar';
            const isAr = lang === 'ar';
            document.documentElement.lang = lang;
            document.documentElement.dir = isAr ? 'rtl' : 'ltr';
            document.documentElement.classList.add('i18n-pending');
            if (isAr) document.documentElement.classList.add('rtl');
        })();
    </script>
  <style>html.i18n-pending body{opacity:0!important;pointer-events:none!important;}</style>
    <style>
        html.i18n-pending body {
            opacity: 0;
            pointer-events: none;
        }

        /* ── Full-bleed hero — matches Contact / About Us / Auctions ── */
        .col-hero {
            position: relative;
            min-height: 420px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            padding: 120px 24px 96px;
        }
        .col-hero__bg {
            position: absolute; inset: 0;
            background-image: url('../assets/images/fill-bg-1.png');
            background-size: cover;
            background-position: center;
            z-index: 0;
        }
        .col-hero__overlay {
            position: absolute; inset: 0;
            background:
                radial-gradient(ellipse at 50% 0%, rgba(0,0,0,.18) 0%, transparent 55%),
                linear-gradient(175deg, rgba(10,8,4,.62) 0%, rgba(5,4,2,.80) 100%);
            z-index: 1;
        }
        .col-hero__content {
            position: relative; z-index: 2;
            max-width: 680px;
            text-align: center !important;
            width: 100%;
        }
        .col-hero__title {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.6rem, 5.5vw, 4.2rem);
            font-weight: 400;
            color: #fff;
            line-height: 1.10;
            margin-bottom: 16px;
            text-align: center !important;
        }
        .col-hero__sub {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            color: rgba(255,255,255,.72);
            line-height: 1.70;
            text-align: center !important;
        }
        .col-hero__line {
            width: 52px; height: 1px;
            background: linear-gradient(90deg, transparent, #c9a96e, transparent);
            margin: 18px auto 0;
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/brand-fonts.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/auctions.css">
    <link rel="stylesheet" href="../css/components/lot-card.css">
    <link rel="stylesheet" href="../css/pages/collection.css">
    <link rel="stylesheet" href="../css/rtl.css?v=5">
    <link rel="stylesheet" href="../css/components/lang-toggle.css">
</head>

<body>
    <div id="site-header"></div>

    <!-- Full-bleed hero -->
    <section class="col-hero">
        <div class="col-hero__bg"></div>
        <div class="col-hero__overlay"></div>
        <div class="col-hero__content">
            <h1 class="col-hero__title" data-i18n="nav.collection">Collection</h1>
            <p class="col-hero__sub" data-i18n="collection.subtitle">قطع نادرة للاستفسار والاقتناء — لم تدخل المزاد بعد.</p>
            <div class="col-hero__line"></div>
        </div>
    </section>

    <main class="section">
        <div class="container">

            <!-- Filter Bar -->
            <div class="filters-wrapper mb-12">

                <div class="filter-group">
                    <label data-i18n="collection.filterStatus">المعرض</label>
                    <div class="filter-tabs">
                        <button class="active" data-status="gallery" data-i18n="collection.gallery">معرض الفن</button>
                    </div>
                </div>

                <div class="filter-group">
                    <label for="group-select" data-i18n="collection.filterGroup">المجموعة</label>
                    <select id="group-select">
                        <option value="">كل المجموعات</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="category-select" data-i18n="collection.filterType">نوع المنتج</label>
                    <select id="category-select">
                        <option value="">كل الأنواع</option>
                    </select>
                </div>

            </div>

            <!-- Collection Intro -->
            <div class="col-intro">
                <span class="col-intro-label" data-i18n="collection.introLabel">COLLECTION</span>
                <h2 class="col-intro-title" data-i18n="collection.introTitle">Curated Pieces</h2>
                <p class="col-intro-desc" data-i18n="collection.introDesc">Explore a refined selection of rare and exceptional items currently available for bidding.</p>
                <div class="col-intro-divider"></div>
            </div>

            <!-- Items Grid -->
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-lg" id="collection-grid">
                <!-- Populated via JS -->
            </div>

            <!-- Pagination -->
            <div class="pagination" id="pagination">
                <button class="pagination-btn" disabled>&larr;</button>
                <button class="pagination-btn active">1</button>
                <button class="pagination-btn" disabled>&rarr;</button>
            </div>
        </div>
    </main>

    <div id="site-footer"></div>
    <script src="../js/utils.js?v=3"></script>
    <script src="../js/api.js?v=4"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/countdown.js"></script>
    <script src="../js/lot-cards.js?v=3"></script>
    <script src="../js/i18n.js"></script>
    <script>
        // ── i18n helper with fallbacks (i18n loads async) ──────────
        const FALLBACK_LABELS = {
            'collection.allGroups':   { ar: 'كل المجموعات',       en: 'All Groups' },
            'collection.allTypes':    { ar: 'كل الأنواع',          en: 'All Types' },
            'collection.filterStatus':{ ar: 'الحالة',              en: 'Status' },
            'collection.filterGroup': { ar: 'المجموعة',            en: 'Group' },
            'collection.filterType':  { ar: 'نوع المنتج',          en: 'Type' },
            'common.all':             { ar: 'الكل',                en: 'All' },
            'auction.live':           { ar: 'مباشر',               en: 'Live' },
            'auction.ended':          { ar: 'منتهي',               en: 'Ended' },
            'time.ended':             { ar: 'منتهي',               en: 'Ended' },
            'errors.loadCollection':  { ar: 'فشل تحميل المعرض',   en: 'Failed to load collection' },
        };
        const T = (k) => {
            const lang = (typeof localStorage !== 'undefined' && localStorage.getItem('lang')) || 'ar';
            if (window.i18n && window.i18n.t) { const v = window.i18n.t(k); if (v && v !== k) return v; }
            const fb = FALLBACK_LABELS[k];
            return (fb && (fb[lang] || fb['en'])) || k;
        };

        let allLots       = [];
        let filteredLots  = [];
        let allCategories = [];

        const filters = { status: 'all', categoryId: '', productType: '' };

        // ── Live countdown engine (same as auctions page) ──────────
        function updateLotTimer(el) {
            const end = el.dataset.lotEnd;
            if (!end) return;
            const diff = new Date(end) - new Date();
            if (diff <= 0) {
                el.textContent = T('time.ended');
                el.classList.remove('ending-soon-timer');
                return;
            }
            const s  = Math.floor(diff / 1000);
            const d  = Math.floor(s / 86400);
            const h  = Math.floor((s % 86400) / 3600);
            const m  = Math.floor((s % 3600) / 60);
            const sc = s % 60;
            let text;
            if (d > 0)      { text = `${d}d ${h}h`; }
            else if (h > 0) { text = `${h}h ${m}m`; }
            else            { text = `${m}m ${String(sc).padStart(2,'0')}s`; el.classList.add('ending-soon-timer'); }
            el.textContent = text;
        }

        function startLotCountdowns() {
            document.querySelectorAll('[data-lot-end]').forEach(updateLotTimer);
            clearInterval(window._colCountdownInterval);
            window._colCountdownInterval = setInterval(() => {
                document.querySelectorAll('[data-lot-end]').forEach(updateLotTimer);
            }, 1000);
        }

        // ── Scroll reveal (IntersectionObserver) ──────────────────
        function initScrollReveal() {
            const observer = new IntersectionObserver((entries) => {
                entries.forEach((entry, i) => {
                    if (entry.isIntersecting) {
                        const el = entry.target;
                        const idx = parseInt(el.dataset.revealIdx || '0', 10);
                        setTimeout(() => el.classList.add('in-view'), idx * 65);
                        observer.unobserve(el);
                    }
                });
            }, { threshold: 0.08 });

            document.querySelectorAll('.lot-card-fade').forEach((el, i) => {
                el.dataset.revealIdx = i;
                observer.observe(el);
            });
        }

        // ── Gallery card (no prices, no Live badge) ──────────────────
        function renderCard(lot, isClosed) {
            return buildGalleryCard(lot);
        }

        // ── Filter logic ──────────────────────────────────────────
        async function initCollection() {
            try {
                const [lotsRes, catsRes] = await Promise.all([
                    lotsAPI.getAll(),
                    categoriesAPI.getAll()
                ]);
                allLots       = lotsRes.lots       || [];
                allCategories = catsRes.categories || [];
                populateFilters();
                applyFilters();
            } catch (err) {
                console.error('Failed to load collection:', err);
                document.getElementById('collection-grid').innerHTML =
                    `<p class="text-muted col-span-full text-center py-12">${T('errors.loadCollection')}</p>`;
                if (window.i18n) window.i18n.translatePage();
            }
        }

        function populateFilters() {
            const groupSelect = document.getElementById('group-select');
            groupSelect.innerHTML = `<option value="">${T('collection.allGroups')}</option>`;
            allCategories
                .sort((a, b) => new Date(b.start_date) - new Date(a.start_date))
                .forEach(cat => {
                    const o = document.createElement('option');
                    o.value = cat.id;
                    o.textContent = localizedField(cat, 'title') || cat.title;
                    groupSelect.appendChild(o);
                });

            const cats = [...new Set(allLots.map(l => l.category).filter(Boolean))].sort();
            const catSelect = document.getElementById('category-select');
            catSelect.innerHTML = `<option value="">${T('collection.allTypes')}</option>`;
            cats.forEach(c => {
                const o = document.createElement('option');
                o.value = c;
                o.textContent = c;
                catSelect.appendChild(o);
            });

            if (window.i18n) window.i18n.translatePage();
        }

        function applyFilters() {
            // Gallery page: show lots that:
            //  1. Have no auction dates (pure gallery items), OR
            //  2. Have dates but show_in_gallery = true (Both mode)
            filteredLots = allLots.filter(lot => {
                const hasNoDates    = !lot.start_date && !lot.end_date;
                const showInGallery = lot.show_in_gallery === true || lot.show_in_gallery === 't';
                if (!hasNoDates && !showInGallery) return false;
                if (filters.categoryId && (lot.category_id || lot.auction_id) !== filters.categoryId) return false;
                if (filters.productType && lot.category !== filters.productType) return false;
                return true;
            });
            renderGrid();
        }

        function renderGrid() {
            const container = document.getElementById('collection-grid');
            container.innerHTML = '';

            if (filteredLots.length === 0) {
                container.innerHTML = `<p class="text-muted col-span-full text-center py-12">${T('collection.noLots')}</p>`;
                return;
            }

            const now = new Date();
            container.innerHTML = filteredLots.map(lot => {
                const endDate = lot.end_date ? new Date(lot.end_date) : null;
                const isClosed = endDate && endDate < now;
                return renderCard(lot, isClosed);
            }).join('');

            initCardSliders(container);
            startLotCountdowns();
            initScrollReveal();
            if (window.i18n) window.i18n.translatePage();
        }

        // ── Event Listeners ───────────────────────────────────────
        document.addEventListener('DOMContentLoaded', () => {
            initCollection();

            // Status filter removed: collection page is gallery-only

            document.getElementById('group-select').addEventListener('change', e => {
                filters.categoryId = e.target.value;
                applyFilters();
            });

            document.getElementById('category-select').addEventListener('change', e => {
                filters.productType = e.target.value;
                applyFilters();
            });
        });
    </script>
</body>

</html>
