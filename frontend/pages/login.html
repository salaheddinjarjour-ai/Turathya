<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="icon" type="image/png" href="../assets/images/Beigelogo.png">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TURATHYA</title>

    <script>
        (function () {
            const lang = localStorage.getItem('lang') || 'ar';
            const isAr = lang === 'ar';
            document.documentElement.lang = lang;
            document.documentElement.dir = isAr ? 'rtl' : 'ltr';
            document.documentElement.classList.add('i18n-pending');
            if (isAr) document.documentElement.classList.add('rtl');
        })();
    </script>
    <style>
        html.i18n-pending body {
            opacity: 0;
            pointer-events: none;
        }
    </style>
    <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/brand-fonts.css">
    <link rel="stylesheet" href="../css/reset.css">
    <link rel="stylesheet" href="../css/typography.css">
    <link rel="stylesheet" href="../css/layout.css">
    <link rel="stylesheet" href="../css/components.css">
    <link rel="stylesheet" href="../css/pages/account.css">

    <link rel="stylesheet" href="../css/rtl.css?v=5">
    <link rel="stylesheet" href="../css/components/lang-toggle.css">
    <style>
        .section {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 80px);
            padding-bottom: 80px;
        }

        .auth-card {
            width: 100%;
            max-width: 450px;
        }
    </style>
</head>

<body>
    <div id="site-header"></div>

    <main class="section">
        <div class="container">
            <div class="auth-container">
                <div class="auth-card">
                    <h1 class="text-center mb-8" data-i18n="auth.loginTitle">Welcome Back</h1>

                    <form id="login-form">
                        <div class="form-group">
                            <label class="form-label">Phone Number</label>
                            <input type="tel" class="form-input" id="phone" placeholder="+963944123456" required>
                        </div>

                        <div class="form-group">
                            <label class="form-label">Password</label>
                            <input type="password" class="form-input" id="password" required>
                        </div>

                        <div id="login-error" class="form-error" style="display: none;"></div>

                        <button type="submit" class="btn btn-primary btn-lg w-full" data-i18n="nav.login">Login</button>
                    </form>

                    <p class="text-center text-sm text-muted mt-6">
                        <span data-i18n="auth.noAccount">Don't have an account?</span>
                        <a href="register.html" class="text-accent" data-i18n="auth.signUp">Register here</a>
                    </p>

                </div>
            </div>
        </div>
    </main>
    <script src="../js/utils.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/i18n.js"></script>
    <script>
        // DO NOT auto-redirect on this page - let user manually log in
        window.addEventListener('DOMContentLoaded', () => {
            sessionStorage.removeItem('loginRedirectCount');
            sessionStorage.removeItem('accountRedirectCount');
        });


        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            const phone = document.getElementById('phone').value;
            const password = document.getElementById('password').value;
            const errorElement = document.getElementById('login-error');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            // Disable submit button
            submitBtn.disabled = true;
            submitBtn.textContent = 'Logging in...';
            errorElement.style.display = 'none';

            try {
                const result = await authAPI.login(phone, password);

                // Check if user is admin
                if (result.user.role === 'admin') {
                    window.location.replace('admin.html');
                } else {
                    window.location.replace('account.html');
                }
            } catch (error) {
                console.error('Login error:', error);
                errorElement.textContent = error.message || 'Login failed. Please try again.';
                errorElement.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.textContent = 'Login';
            }
        });
    </script>
</body>

</html>
