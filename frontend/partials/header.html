<!DOCTYPE html>
<header class="header">
    <div class="container">
        <div class="header-content">

            <!-- Logo -->
            <a href="index.html" class="logo" id="logo-link">
                <img loading="lazy" src="assets/images/zauction-logo-new.png" alt="TURATHYA" style="height: 48px; width: auto;">
            </a>

            <!-- Desktop Nav (centered) -->
            <nav class="nav" id="main-nav">
                <a href="auctions.html"          class="nav-link" id="auctions-link"   data-i18n="nav.auctions">Auctions</a>
                <a href="collection.html"         class="nav-link" id="collection-link" data-i18n="nav.collection">Collection</a>
                <a href="pages/info/about-us.html" class="nav-link" id="about-link"    data-i18n="nav.about">About Us</a>
                <a href="pages/info/contact.html"  class="nav-link" id="contact-link"  data-i18n="nav.contact">Contact Us</a>
                <a href="account.html"  class="nav-link user-link"  id="account-link"  style="display:none;" data-i18n="nav.account">Account</a>
                <a href="admin.html"    class="nav-link admin-link" id="admin-link"    style="display:none;" data-i18n="nav.admin">Admin</a>
                <a href="login.html"    class="nav-link auth-link"  id="login-link"    data-i18n="nav.login">Login</a>
                <a href="register.html" class="nav-link auth-link"  id="register-link" data-i18n="nav.register">Register</a>
                <button onclick="logout()" class="btn btn-ghost btn-sm user-link" style="display:none;" data-i18n="nav.logout">Logout</button>
            </nav>

            <!-- Language Toggle -->
            <div class="lang-toggle-container">
                <a href="#" class="lang-toggle" data-lang="en" aria-label="Switch to English">EN</a>
                <a href="#" class="lang-toggle" data-lang="ar" aria-label="التبديل إلى العربية">العربية</a>
            </div>

            <!-- Hamburger — mobile only -->
            <button class="mobile-menu-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="mobile-menu-overlay">
                <span></span>
                <span></span>
                <span></span>
            </button>

        </div>
    </div>
</header>

<!-- Full-Screen Mobile Menu Overlay -->
<div class="mobile-menu" id="mobile-menu-overlay" role="dialog" aria-modal="true" aria-label="Navigation menu">

    <!-- Close Button -->
    <button class="mobile-menu-close" aria-label="Close menu">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
    </button>

    <!-- Nav Links -->
    <nav class="mobile-nav">
        <a href="auctions.html"           class="mobile-nav-link" id="m-auctions-link"   data-i18n="nav.auctions">Auctions</a>
        <a href="collection.html"          class="mobile-nav-link" id="m-collection-link" data-i18n="nav.collection">Collection</a>
        <a href="pages/info/about-us.html" class="mobile-nav-link" id="m-about-link"      data-i18n="nav.about">About Us</a>
        <a href="pages/info/contact.html"  class="mobile-nav-link" id="m-contact-link"    data-i18n="nav.contact">Contact Us</a>
        <a href="account.html"  class="mobile-nav-link user-link"  id="m-account-link"    style="display:none;" data-i18n="nav.account">Account</a>
        <a href="admin.html"    class="mobile-nav-link admin-link" id="m-admin-link"      style="display:none;" data-i18n="nav.admin">Admin</a>
        <a href="login.html"    class="mobile-nav-link auth-link"  id="m-login-link"      data-i18n="nav.login">Login</a>
        <a href="register.html" class="mobile-nav-link auth-link"  id="m-register-link"   data-i18n="nav.register">Register</a>
        <button onclick="logout(); document.getElementById('mobile-menu-overlay').classList.remove('open');"
                class="mobile-nav-link user-link" style="display:none; background:none; border:none; cursor:pointer; text-align:inherit; font:inherit;"
                data-i18n="nav.logout">Logout</button>
    </nav>

    <!-- Mobile Language Toggle -->
    <div class="mobile-lang-toggle">
        <a href="#" class="lang-toggle" data-lang="en" aria-label="English">EN</a>
        <a href="#" class="lang-toggle" data-lang="ar" aria-label="العربية">العربية</a>
    </div>

</div>

<!-- Approval Pending Banner -->
<div id="approval-banner"
    style="display: none; background: rgba(47, 79, 62, 0.16); color: var(--color-olive-dark); border-top: 1px solid rgba(47, 79, 62, 0.35); border-bottom: 1px solid rgba(47, 79, 62, 0.35); padding: 12px 0; text-align: center; font-size: 14px; font-weight: 500;">
    <div class="container">
        <span data-i18n="account.pendingApproval">⚠️ Your account is pending admin approval. You can browse the site but cannot place bids until approved.</span>
    </div>
</div>
