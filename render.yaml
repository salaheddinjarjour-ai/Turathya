# Render Blueprint — Turathya Auction Platform
# See https://docs.render.com/infrastructure-as-code

databases:
  - name: turathya-db
    plan: free
    databaseName: turathya
    user: turathya

services:
  - type: web
    name: turathya-backend
    plan: free
    runtime: node
    rootDir: zauction-backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: turathya-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://melodious-parfait-a2944a.netlify.app
      - key: FRONTEND_URLS
        value: https://melodious-parfait-a2944a.netlify.app,https://turathya.netlify.app
      - key: ALLOW_NETLIFY_PREVIEWS
        value: "true"
      - key: DB_SSL
        value: "true"
      - key: WHATSAPP_OTP_ENABLED
        value: "true"
      - key: WHATSAPP_BRIDGE_URL
        value: https://turathya-whatsapp-bridge.onrender.com
      - key: WHATSAPP_LIVE_NOTIFICATIONS_ENABLED
        value: "false"

  - type: web
    name: turathya-whatsapp-bridge
    plan: free
    runtime: node
    rootDir: whatsapp-integration/backend
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: FRONTEND_URL
        value: https://melodious-parfait-a2944a.netlify.app
