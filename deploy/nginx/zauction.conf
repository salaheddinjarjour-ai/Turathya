
# ── Social/Search bot detection ──────────────────────────────────
map $http_user_agent $is_social_bot {
    default                         0;
    ~*facebookexternalhit           1;
    ~*Twitterbot                    1;
    ~*WhatsApp                      1;
    ~*LinkedInBot                   1;
    ~*Slackbot                      1;
    ~*TelegramBot                   1;
    ~*Discordbot                    1;
    ~*Googlebot                     1;
    ~*bingbot                       1;
    ~*Applebot                      1;
    ~*ia_archiver                   1;
    ~*crawler                       1;
    ~*spider                        1;
}

server {
    server_name turathya.com www.turathya.com;




    # ══════════════════════════════════════════════════════════════════
    #  301 REDIRECTS — old .html / /pages/ URLs → clean URLs
    # ══════════════════════════════════════════════════════════════════
    location = /pages/auctions.html      { return 301 /auctions; }
    location = /pages/collection.html    { return 301 /collection; }
    location = /pages/auction.html       { return 301 "/auction$is_args$args"; }
    location = /pages/account.html       { return 301 /account; }
    location = /pages/admin.html         { return 301 /admin; }
    location = /pages/login.html         { return 301 /login; }
    location = /pages/register.html      { return 301 /register; }
    location = /pages/info/about-us.html { return 301 /about-us; }
    location = /pages/info/about.html    { return 301 /about; }
    location = /pages/info/buyers-guide.html    { return 301 /buyers-guide; }
    location = /pages/info/condition-reports.html { return 301 /condition-reports; }
    location = /pages/info/contact.html  { return 301 /contact; }
    location = /pages/info/cookies.html  { return 301 /cookies; }
    location = /pages/info/fees-payments.html   { return 301 /fees-payments; }
    location = /pages/info/how-bidding-works.html { return 301 /how-bidding-works; }
    location = /pages/info/privacy.html  { return 301 /privacy; }
    location = /pages/info/shipping-pickup.html { return 301 /shipping-pickup; }
    location = /pages/info/team.html     { return 301 /team; }
    location = /pages/info/terms.html    { return 301 /terms; }
    location = /pages/info/authentication.html { return 301 /authentication; }

    # ══════════════════════════════════════════════════════════════════
    #  CLEAN URL SERVING — clean path → actual HTML file
    # ══════════════════════════════════════════════════════════════════
    location = /auctions        { root /var/www/zauction-frontend; try_files /pages/auctions.html =404; }
    location = /collection      { root /var/www/zauction-frontend; try_files /pages/collection.html =404; }
    location = /auction         { root /var/www/zauction-frontend; try_files /pages/auction.html =404; }
    location = /account         { root /var/www/zauction-frontend; try_files /pages/account.html =404; }
    location = /admin           { root /var/www/zauction-frontend; try_files /pages/admin.html =404; }
    location = /login           { root /var/www/zauction-frontend; try_files /pages/login.html =404; }
    location = /register        { root /var/www/zauction-frontend; try_files /pages/register.html =404; }
    location = /about-us        { root /var/www/zauction-frontend; try_files /pages/info/about-us.html =404; }
    location = /about           { root /var/www/zauction-frontend; try_files /pages/info/about.html =404; }
    location = /buyers-guide    { root /var/www/zauction-frontend; try_files /pages/info/buyers-guide.html =404; }
    location = /condition-reports { root /var/www/zauction-frontend; try_files /pages/info/condition-reports.html =404; }
    location = /contact         { root /var/www/zauction-frontend; try_files /pages/info/contact.html =404; }
    location = /cookies         { root /var/www/zauction-frontend; try_files /pages/info/cookies.html =404; }
    location = /fees-payments   { root /var/www/zauction-frontend; try_files /pages/info/fees-payments.html =404; }
    location = /how-bidding-works { root /var/www/zauction-frontend; try_files /pages/info/how-bidding-works.html =404; }
    location = /privacy         { root /var/www/zauction-frontend; try_files /pages/info/privacy.html =404; }
    location = /shipping-pickup { root /var/www/zauction-frontend; try_files /pages/info/shipping-pickup.html =404; }
    location = /team            { root /var/www/zauction-frontend; try_files /pages/info/team.html =404; }
    location = /terms           { root /var/www/zauction-frontend; try_files /pages/info/terms.html =404; }
    location = /authentication  { root /var/www/zauction-frontend; try_files /pages/info/authentication.html =404; }

    # ── SEO slug URLs: /lot/<title>-<uuid> → serve lot.html ─────────
    location /lot/ {
        # Bots get server-side OG meta tags from backend
        if ($is_social_bot) {
            proxy_pass http://localhost:3000/share/lot-by-slug?path=$request_uri;
        }
        # Humans get the static lot.html SPA
        root /var/www/zauction-frontend;
        try_files $uri /pages/lot.html;
    }

    # ── Bot intercept: serve OG meta tags for lot pages ──────────────
    location = /pages/lot.html {
        if ($is_social_bot) {
            proxy_pass http://localhost:3000/share/lot-by-id?id=$arg_id;
        }
        root /var/www/zauction-frontend;
        try_files $uri =404;
    }

    # Frontend
    location / {
        root /var/www/zauction-frontend;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # WhatsApp bridge (before /api to take priority)
    location /api/whatsapp {
        proxy_pass http://localhost:3001/api/whatsapp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }


    # Share/OG endpoint — crawler-friendly meta tags served by backend
    location /share {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Backend API
    location /api {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket
    location /socket.io {
        proxy_pass http://localhost:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
     location /api/messages {
        proxy_pass http://localhost:3001/api/messages;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/turathya.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/turathya.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot


}

server {
    if ($host = www.turathya.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = turathya.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name turathya.com www.turathya.com;
    return 404; # managed by Certbot




}
